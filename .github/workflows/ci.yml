name: CI

# 每次推送与 PR 都检查三个平台。
#
# 为什么需要：release 工作流只在推 `v*` 标签时跑，而带 `#[cfg(unix)]` 的
# 代码在 Windows 上**永远不编译**——平台专属的编译错误会一直潜伏到发版那天
# 才暴露（v0.1.0 的首次构建就是这样翻车的）。
# 所以这里对每个平台都跑一次 `cargo check --all-targets`，类型检查不需要链接器，
# 比完整构建快得多。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 检查 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 类型检查覆盖全部 target 与测试代码——平台专属的编译问题在这一步就能暴露。
      - name: 类型检查
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

      # 真跑一次二进制。只编译不运行的话，平台差异（比如 macOS 上
      # `atlas sshd status` 走 launchd 而非 systemctl）根本不会被发现。
      # 显式指定 bash——Windows runner 的默认 shell 是 PowerShell，
      # 下面这段 bash 语法会被它当 PowerShell 解析而报错。
      - name: 构建并冒烟
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p atlas-cli
          BINARY="target/${{ matrix.target }}/release/atlas"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BINARY="target/${{ matrix.target }}/release/atlas.exe"
          fi
          "$BINARY" --version
          "$BINARY" --help > /dev/null
          # 各平台的系统 SSH 服务查询——这是平台差异最集中的地方。
          "$BINARY" sshd status || true

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Cargo.lock 已入库；--locked 保证测的依赖与提交一致。
      - name: 跑测试
        run: cargo test --workspace --locked

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
