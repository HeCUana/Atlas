name: Release

# 推 `v*` 标签时构建多平台二进制并创建 GitHub Release。
#
# 为什么不在本地交叉编译：Rust 交叉编译到 Linux/macOS 还需要对应的
# 链接器与 SDK，CI 用各平台的原生 runner 最省事也最可靠。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: atlas
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: atlas.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: atlas
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cargo.lock 已入库；--locked 保证发布用的依赖与提交一致。
      - name: 构建
        run: cargo build --release --locked --target ${{ matrix.target }} -p atlas-cli

      # 每个包都带上 README、许可与配置模板——下载下来就能直接用。
      - name: 准备发布目录
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/atlas-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          cp README.md LICENSE atlas.toml.example "$stage/"

      # Windows runner 不保证有 `zip` 命令，用 PowerShell 原生压缩。
      - name: 打包 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\atlas-${{ matrix.target }}" `
            -DestinationPath "dist\atlas-${{ matrix.target }}.zip"
          Remove-Item -Recurse -Force "dist\atlas-${{ matrix.target }}"

      - name: 打包 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tar czf "dist/atlas-${{ matrix.target }}.tar.gz" -C dist "atlas-${{ matrix.target }}"
          rm -rf "dist/atlas-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 必须 checkout：`gh release create` 要在 git 仓库里工作，
      # `--generate-notes` 还要靠 git 历史算发布说明。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f | sort)
          printf '将上传 %d 个文件:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${files[@]}"
