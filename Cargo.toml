[workspace]
resolver = "3"
members = [
    "crates/atlas-core",
    "crates/atlas-parser",
    "crates/atlas-server",
    "crates/atlas-plugin",
    "crates/atlas-sftp",
    "crates/atlas-tui",
    "crates/atlas-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/HeCUana/Atlas"
authors = ["HeCUana"]

[workspace.dependencies]
# 内部 crate
atlas-core = { path = "crates/atlas-core" }
atlas-parser = { path = "crates/atlas-parser" }
atlas-server = { path = "crates/atlas-server" }
atlas-plugin = { path = "crates/atlas-plugin" }
atlas-sftp = { path = "crates/atlas-sftp" }
atlas-tui = { path = "crates/atlas-tui" }

# 运行时与通用
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
anyhow = "1"
thiserror = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tar = "0.4"

# CLI / 命令树
# `string` feature 是必需的：命令树在运行时从插件动态构建 clap::Command，
# 名称是运行时的 String，没有它 clap::Str 只接受 &'static str。
clap = { version = "4", features = ["derive", "string"] }

# 日志与追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# 解析
regex = "1"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# SSH / SFTP
russh = "0.63"
russh-sftp = "3"

# 动态库加载（实验性热重载路径）
libloading = "0.8"

# 测试
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
